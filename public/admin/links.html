<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .atable-links .atable-row { grid-template-columns: minmax(240px,1fr) 230px 90px 70px 105px 105px 260px; }
      .atable-links .at-owner { display:flex; flex-direction:column; gap:3px; min-width:0; }
      .atable-links .at-owner .at-sub { font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .atable-links .at-owner-missing { font-family:monospace; font-size:12px; }
      @media (max-width: 1100px) {
        .atable-links { overflow-x:auto; }
        .atable-links .atable-row { min-width:1220px; }
      }
    </style>
    <title>Links · ashrt.link admin</title>
  </head>
  <body data-page="links" class="admin-body">
    <header class="admin-bar" id="adminbar"></header>
    <main class="admin-main">
      <div class="admin-head">
        <h1>Links</h1>
        <div class="admin-tools">
          <input id="search" class="toolbar-search" type="search" placeholder="Search short code or destination" />
          <input id="owner" class="toolbar-search" type="search" placeholder="Owner user ID" />
          <select id="status" class="toolbar-select">
            <option value="">Any status</option>
            <option value="active">Active</option>
            <option value="flagged">Flagged</option>
            <option value="disabled">Disabled</option>
            <option value="expired">Expired</option>
          </select>
          <select id="guest" class="toolbar-select">
            <option value="">Anyone</option>
            <option value="true">Guest links</option>
            <option value="false">Account links</option>
          </select>
        </div>
      </div>
      <div id="count" class="admin-count"></div>
      <div class="table-card">
        <div class="atable atable-links" id="rows"></div>
        <div id="empty" class="chart-empty" style="display:none">No links match that.</div>
      </div>
      <div class="admin-more"><button id="more" class="btn btn-ghost" style="display:none">Load more</button></div>
    </main>
    <script src="/admin/shell.js"></script>
    <script src="/admin/links.js"></script>
  </body>
</html>
