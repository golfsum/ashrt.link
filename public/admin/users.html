<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Users · ashrt.link admin</title>
  </head>
  <body data-page="users" class="admin-body">
    <header class="admin-bar" id="adminbar"></header>
    <main class="admin-main">
      <div class="admin-head">
        <h1>Users</h1>
        <div class="admin-tools">
          <input id="search" class="toolbar-search" type="search" placeholder="Search email, name or user id" />
          <select id="filter" class="toolbar-select">
            <option value="">All accounts</option>
            <option value="paid">Paid</option>
            <option value="free">Free</option>
            <option value="suspended">Suspended</option>
            <option value="admin">Admins</option>
          </select>
        </div>
      </div>
      <div id="count" class="admin-count"></div>
      <div class="table-card">
        <div class="atable atable-users" id="rows"></div>
        <div id="empty" class="chart-empty" style="display:none">No accounts match that.</div>
      </div>
      <div class="admin-more"><button id="more" class="btn btn-ghost" style="display:none">Load more</button></div>
    </main>
    <script src="/admin/shell.js"></script>
    <script src="/admin/users.js"></script>
  </body>
</html>
