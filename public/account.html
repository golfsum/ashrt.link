<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Billing · ashrt.link</title>
  </head>
  <body data-page="billing">
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main">
        <div class="main-inner">
          <header class="topbar">
            <div>
              <h1>Billing</h1>
              <p class="sub">Your plan and account details.</p>
            </div>
          </header>

          <section class="panel-card">
            <div class="panel-head"><h2>Account</h2></div>
            <div class="set-row"><label>Email</label><div id="email" class="set-static mono">—</div></div>
            <div class="set-row"><label>Sign-in method</label><div id="provider" class="set-static">—</div></div>
            <div class="set-row"><label>Plan</label><div><span id="plan" class="plan-tag">Free</span></div></div>
          </section>

          <div id="billing-banner" class="notice" hidden></div>

          <section class="panel-card" style="margin-top:16px">
            <div class="panel-head">
              <h2>This period</h2>
              <button id="manage" class="btn btn-sm btn-ghost" hidden>Manage subscription</button>
            </div>
            <p id="billing-note" class="panel-sub"></p>
            <div id="usage" class="usage-grid"></div>
          </section>

          <section class="panel-card" style="margin-top:16px">
            <div class="panel-head"><h2>Plans</h2></div>
            <p class="panel-sub">
              Changing plan never removes anything you have already made: your links keep
              redirecting, your QR codes keep resolving and your history is kept.
              <a href="/pricing">See the full comparison</a>.
            </p>
            <div id="plan-options"></div>
            <p class="price-error" data-plan-error></p>
          </section>
        </div>
      </main>
    </div>

    <script src="/shell.js"></script>
    <script src="/plans-ui.js"></script>
    <script src="/account.js"></script>
  </body>
</html>
